# ================================
# GitHub Actions CI/CD Pipeline
# ================================

# Name shown in the GitHub Actions UI
name: CI/CD Pipeline

# ----------------
# Triggers
# ----------------
# This workflow runs when:
# 1) Code is pushed to main or dev
# 2) A pull request targets main or dev
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# ----------------
# Jobs Definition
# ----------------
jobs:
  test-and-build:
    # Use the latest Ubuntu runner provided by GitHub
    runs-on: ubuntu-latest

    # ----------------
    # Service Containers
    # ----------------
    # These are Docker containers that run alongside your job.
    # They simulate your production dependencies (DB, cache, vector DB).
    services:

      # PostgreSQL service for backend tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moon_guide
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Health check to wait until Postgres is ready
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # Redis service for caching / queues
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      # Qdrant service for vector search / embeddings
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    # ----------------
    # Environment Variables
    # ----------------
    # These are shared by all steps
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moon_guide
      REDIS_URL: redis://localhost:6379
      QDRANT_URL: http://localhost:6333
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000

    # ----------------
    # Steps
    # ----------------
    steps:

      # 1️⃣ Pull your repository code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # ======================
      # 🔹 BACKEND (Python)
      # ======================

      # Install Python 3.11 on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install backend dependencies
      - name: Install backend deps
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Run linting tools to enforce code style & quality
      - name: Lint backend
        working-directory: backend
        run: |
          ruff check .        # Fast Python linter
          black --check .     # Code formatter (check mode only)

      # Run backend unit/integration tests
      - name: Run backend tests
        working-directory: backend
        run: pytest

      # ======================
      # 🔹 FRONTEND (Next.js / React)
      # ======================

      # Install Node.js v20
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install frontend dependencies
      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      # Lint frontend code (ESLint / Next lint)
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # Run frontend tests in CI mode
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --ci

      # ======================
      # 🔹 DOCKER BUILD
      # ======================

      # Build Docker images for backend & frontend
      - name: Build Docker images
        run: |
          docker build -t moon-guide-backend ./backend
          docker build -t moon-guide-frontend ./frontend
